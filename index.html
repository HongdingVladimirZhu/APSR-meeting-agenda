<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meeting Agenda</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Merriweather:ital,wght@0,300;0,400;0,700;1,300&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Merriweather', serif;
        background-color: #f4f1ea; /* Paper color */
      }
      .typewriter {
        font-family: 'Special Elite', cursive;
      }
      .paper-shadow {
        box-shadow: 1px 1px 2px rgba(0,0,0,0.05), 
                    10px 10px 25px rgba(0,0,0,0.1);
      }
      /* Custom scrollbar for textareas to look more analog */
      textarea::-webkit-scrollbar {
        width: 12px;
      }
      textarea::-webkit-scrollbar-track {
        background: #f4f1ea;
      }
      textarea::-webkit-scrollbar-thumb {
        background-color: #888;
        border-radius: 6px;
        border: 3px solid #f4f1ea;
      }
      .step-number {
        font-family: 'Special Elite', cursive;
        background: #374151;
        color: white;
        width: 1.5rem;
        height: 1.5rem;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 50%;
        font-size: 0.75rem;
        margin-right: 0.5rem;
      }
    </style>
</head>
  <body class="text-gray-800 antialiased">
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
